<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>갑옷 강화 - 관리자 대시보드</title>
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <div class="header">
      <h1>🛡️ 갑옷 강화 - 관리자 대시보드</h1>
      <p class="subtitle">게임 플레이 데이터 조회 및 분석</p>
    </div>

    <!-- 통계 -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-label">총 사용자</div>
        <div class="stat-value">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">총 세션</div>
        <div class="stat-value">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">총 이벤트</div>
        <div class="stat-value">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">+20 달성</div>
        <div class="stat-value">-</div>
      </div>
    </div>

    <!-- 제어판 -->
    <div class="controls">
      <div class="control-group">
        <h3>📊 데이터 내보내기</h3>
        <div class="button-group">
          <button class="btn-primary" id="btn-export-excel">📥 Excel 다운로드</button>
          <button class="btn-secondary" id="btn-export-csv">📥 CSV 다운로드</button>
          <button class="btn-secondary" id="btn-export-json">📥 JSON 다운로드</button>
        </div>
        <div class="status" id="export-status"></div>
      </div>

      <div class="control-group">
        <h3>🔄 데이터 새로고침</h3>
        <div class="button-group">
          <button class="btn-success" id="btn-refresh">🔄 새로고침</button>
        </div>
        <div class="status" id="refresh-status"></div>
      </div>
    </div>

    <!-- 데이터 테이블 -->
    <div class="data-table">
      <table id="data-table">
        <thead>
          <tr>
            <th>세션 ID</th>
            <th>사용자</th>
            <th>시간</th>
            <th>최종 단계</th>
            <th>최종 골드</th>
            <th>파괴 횟수</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="7" style="text-align: center; color: #999;">데이터 로드 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="admin-dashboard.js"></script>
</body>
</html>
